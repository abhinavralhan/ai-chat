  # ---------- trap ----------
  - id: trap_07
    category: trap
    question: How many orders were placed in June 2026?
    answer_type: number
    expected_behavior: answer
    notes: ordered_at is a timestamp. "<= '2026-06-30'" drops most of 30 June; the 1 July order must not be counted.
    tolerance: 0
    reference_sql: |
      select count(*) from marts.fct_orders
      where ordered_at >= '2026-06-01' and ordered_at < '2026-07-01'

  - id: trap_08
    category: trap
    question: How many new customers did we get in H1 2026?
    answer_type: number
    expected_behavior: answer
    notes: Excludes the one customer created on 1 July.
    tolerance: 0
    reference_sql: |
      select count(*) from marts.dim_customers
      where created_at >= '2026-01-01' and created_at < '2026-07-01'

  - id: trap_09
    category: trap
    question: How many unique visitors came to the website?
    answer_type: number
    expected_behavior: answer
    notes: Distinct visitors, not sessions. One visitor can have many sessions.
    reference_sql: select count(distinct visitor_id) from marts.fct_sessions

  - id: trap_10
    category: trap
    question: What share of net revenue came from orders without a campaign?
    answer_type: number
    expected_behavior: answer
    notes: Organic and direct orders have a NULL campaign; "= null" filters match nothing.
    reference_sql: |
      select sum(net_revenue_eur) filter (where campaign_id is null) / sum(net_revenue_eur)
      from marts.fct_orders

  - id: trap_11
    category: trap
    question: What is the click-through rate of the newsletter?
    answer_type: none
    expected_behavior: refuse
    notes: The newsletter has no ad impressions, so CTR is undefined. Not 0.

  - id: trap_12
    category: trap
    question: For each paid campaign, what were net revenue and ad spend?
    answer_type: table
    expected_behavior: answer
    notes: Joining daily ad spend rows to orders on campaign multiplies both. Aggregate each side first.
    reference_sql: |
      with r as (select campaign_id, sum(net_revenue_eur) as rev from marts.fct_orders group by 1),
           s as (select campaign_id, sum(spend_eur) as spend from marts.fct_ad_spend group by 1)
      select c.campaign_name, r.rev, s.spend
      from marts.dim_campaigns c join r using (campaign_id) join s using (campaign_id)
      where c.channel_type = 'paid' order by 1
