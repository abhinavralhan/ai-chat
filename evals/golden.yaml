    notes: nl_spring_sale has no ad spend or clicks, so it has no cost per click.
    reference_sql: |
      select c.campaign_name from marts.fct_ad_spend a
      join marts.dim_campaigns c using (campaign_id) where c.objective = 'conversion'
      group by 1 order by sum(a.spend_eur) / sum(a.clicks) limit 1

  - id: join_12
    category: multi_hop_join
    question: What was net revenue per campaign objective?
    answer_type: table
    expected_behavior: answer
    notes: Orders without a campaign (organic, direct) have no objective and are left out or shown as empty.
    reference_sql: |
      select c.objective, sum(o.net_revenue_eur) from marts.fct_orders o
      join marts.dim_campaigns c using (campaign_id) group by 1 order by 1

