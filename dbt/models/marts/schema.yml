models:
  - name: dim_channels
    columns:
      - name: channel_id
        data_tests: [unique, not_null]
      - name: channel_type
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, owned, organic]

  - name: dim_campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: channel_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_id

  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: acquisition_channel_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_id

  - name: fct_sessions
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: channel_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_id
      - name: campaign_id # null for organic/direct sessions, by design
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_id

  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sessions')
                field: session_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [completed, refunded, cancelled]

  - name: fct_ad_spend
    columns:
      - name: ad_spend_id
        data_tests: [unique, not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_id
